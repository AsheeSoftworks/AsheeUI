name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Reset working directory
        run: |
          git reset --hard
          git clean -fd

      - name: Name the account the release credential belongs to
        # A refused publish arrives as "E403: 403 Forbidden - PUT ... - [object Object]",
        # because pnpm prints npm's JSON body as an object with no toString: the one
        # part of the failure that says whether the token is unknown, wrong-scoped or
        # refused on the account's behalf never reaches the log. One request to
        # /-/whoami first turns "refused for some reason" into "refused for <account>".
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          answered=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $NODE_AUTH_TOKEN" \
            https://registry.npmjs.org/-/whoami 2>&1 || true)
          code=$(printf '%s' "$answered" | tail -n1)
          body=$(printf '%s' "$answered" | sed '$d')
          echo "registry answered $code for NPM_TOKEN: $body"
          echo "the credential reaches these packages in @asheeui:"
          npm access list packages @asheeui || true
          case "$code" in
            200) ;;
            401 | 403)
              echo "::error title=Release credential::The registry does not accept NPM_TOKEN ($code). Store a granular access token with \"Read and write (publish and stage)\" for all packages and \"Bypass 2FA\" enabled as the NPM_TOKEN secret, then re-run this release."
              exit 1
              ;;
            *)
              echo "::warning title=Release credential::The registry did not answer the probe ($code). Publishing continues, and the registry reports its refusal there."
              ;;
          esac

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm changeset publish
          commit-message: "chore: version packages"
          pr-title: "chore: publish package updates"
          create-github-releases: true
          push-git-tags: true
        # The registry credentials belong to this step and to no other: the action is
        # what publishes, and without them npm sends the request unauthenticated and
        # the registry answers 404 for a scoped package, which reads like a missing
        # package rather than a missing token.
        env:
          PNPM_CONFIG_PROVENANCE: "true"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify the registry carries every released version
        # A run that reports success while publishing nothing leaves a green tick, a
        # tag and no version. This reads the workspace manifests and asks the
        # registry, so that state fails here with the version named.
        if: steps.changesets.outcome == 'success'
        run: pnpm verify:released

      - name: Explain a failed release step
        if: failure() && steps.changesets.outcome == 'failure'
        run: |
          echo "::error title=Release step::changesets/action failed. Two causes account for this."
          echo "1. It could not open the version pull request, which GitHub blocks until the repository"
          echo "   allows it: Settings -> Actions -> General -> Workflow permissions"
          echo "   -> Allow GitHub Actions to create and approve pull requests."
          echo "2. It could not publish. The registry answers 404 for a scoped package when the request is"
          echo "   unauthenticated, so check that this step carries NPM_TOKEN and that the token may publish"
          echo "   the @asheeui packages."

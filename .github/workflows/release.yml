name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      - name: Run Tests
        run: pnpm test

      - name: Reset working directory
        run: |
          git reset --hard
          git clean -fd

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm version-packages
          publish-script: pnpm changeset publish
          commit-message: "chore: version packages"
          pr-title: "chore: publish package updates"
          create-github-releases: true
          push-git-tags: true

      - name: Explain a version pull request that could not be opened
        if: failure() && steps.changesets.outcome == 'failure'
        run: |
          echo "::error title=Version pull request::changesets/action could not open the version pull request."
          echo "It versions the packages and pushes the branch, and then needs permission to open a pull request."
          echo "Enable it in this repository:"
          echo "  Settings -> Actions -> General -> Workflow permissions"
          echo "  -> Allow GitHub Actions to create and approve pull requests"
          echo "Until it is enabled, a push to main that carries a changeset fails here instead of opening the pull request."
        env:
          PNPM_CONFIG_PROVENANCE: "true"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

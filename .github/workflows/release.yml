name: Release

# Proves that `main` is releasable. Publishing is deliberately manual: run
# `pnpm changeset version`, review the changelogs, then `pnpm changeset publish` from a
# maintainer's machine with the npm credentials. Nothing here touches the registry, so a
# push to `main` can never publish by accident.

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      # The artifact this checks is the one a manual `pnpm changeset publish` would pack,
      # and a package that renders unstyled in every consumer is not a release.
      - name: Native Artifact
        run: pnpm check:native-artifact

      - name: Run Tests
        run: pnpm test

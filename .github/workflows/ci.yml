name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # The changeset check compares the branch with the base it left, which
          # needs the history a shallow checkout does not carry.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Changeset
        if: github.event_name == 'pull_request'
        run: pnpm check:changesets --base origin/${{ github.base_ref }}

      - name: Lint
        run: pnpm lint

      # Typecheck is a separate gate from the build: a package's build can succeed
      # while a rename silently breaks a consumer's types, because the build only
      # reads its own sources.
      - name: Typecheck
        run: pnpm check:types

      - name: Native Parity
        run: pnpm check:native-parity

      # The shrink's ratchet: core is the contract, not the engine. No class string, no
      # dependency, no renderer import, and no export neither a renderer nor a test reads.
      - name: Core Charter
        run: pnpm check:core-charter

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

      # The one check the test suite cannot make: it reads the built artifact, because the
      # native tests compile sources (which contain JSX) and a defect in the published emit
      # is invisible to them.
      - name: Native Artifact
        run: pnpm check:native-artifact

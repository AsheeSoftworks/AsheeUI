name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          # The changeset check compares the branch with the base it left, which
          # needs the history a shallow checkout does not carry.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Changeset
        if: github.event_name == 'pull_request'
        run: pnpm check:changesets --base origin/${{ github.base_ref }}

      - name: Lint
        run: pnpm lint

      - name: Native Parity
        run: pnpm check:native-parity

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

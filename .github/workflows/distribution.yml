name: Distribution

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  distribution:
    name: Verify the published manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm build

      # The one check a resolver has to make: the umbrella's `exports` map sends a
      # default build to `@asheeui/web` and a `react-native` build to `@asheeui/native`.
      - name: Native Routing
        run: pnpm verify:native-routing

      - name: Native Artifact
        run: pnpm check:native-artifact

      - name: Resolve Every File the Published Manifests Promise
        run: pnpm verify:distribution

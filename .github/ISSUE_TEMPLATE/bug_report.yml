name: Bug report
description: Report a bug or unexpected behavior in AsheeUI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        detail as possible so maintainers can reproduce and fix the issue
        quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: Describe what is wrong.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a numbered list of steps that trigger the bug.
      placeholder: |
        1. Create a new Vite project with AsheeUI.
        2. Render a `<Button variant="solid">` inside a Card.
        3. Observe the unexpected result.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: The button should render with the solid primary styles.
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened? Include screenshots or error output when useful.
      placeholder: The button renders with no background color.
    validations:
      required: true
  - type: input
    id: reproduction-link
    attributes:
      label: Minimal reproduction link
      description: Link to a CodeSandbox, StackBlitz, or GitHub repo that reproduces the issue.
      placeholder: https://codesandbox.io/...
    validations:
      required: false
  - type: input
    id: asheeui-version
    attributes:
      label: AsheeUI version
      description: The version of `asheeui` you are using, for example from your lockfile or `package.json`.
      placeholder: 0.6.13
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: 19.2.8
    validations:
      required: true
  - type: input
    id: browser-environment
    attributes:
      label: Browser or environment
      description: Where did you see the bug? Include your OS and browser when relevant.
      placeholder: Chrome 126 on macOS 15
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue and this is not a duplicate.
          required: true
        - label: I have included a minimal reproduction when possible.
          required: false

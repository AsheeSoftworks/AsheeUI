name: Bug report
description: Report a bug or unexpected behavior in AsheeUI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        detail as possible so maintainers can reproduce and fix the issue
        quickly.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
      placeholder: Describe the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Provide a numbered list of steps that trigger the bug.
      placeholder: |
        1. Create a new Vite project with AsheeUI.
        2. Render a `<Button variant="solid">` inside a Card.
        3. Observe the unexpected result.
      render: markdown
    validations:
      required: true
  - type: input
    id: reproduction-link
    attributes:
      label: Minimal reproduction link
      description: Link to a CodeSandbox, StackBlitz, or GitHub repo that reproduces the issue.
      placeholder: https://codesandbox.io/...
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Share your runtime environment details.
      placeholder: |
        OS: macOS 15
        Browser: Chrome 126
        asheeui version: 0.5.0
        React version: 19.0.0
        Package manager: pnpm 11
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue and this is not a duplicate.
          required: true
        - label: I have included a minimal reproduction when possible.
          required: false

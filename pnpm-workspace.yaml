packages:
  - "packages/*"
  - "apps/*"
  # `apps/docs` is a separate git repository, and it depends on the *published* packages with
  # caret ranges rather than on `workspace:*` links: the site is deployed on its own and pins
  # what a consumer can install today. It is therefore not a member here, because a release
  # that bumps the versions would otherwise leave its manifest naming a version that cannot be
  # installed until the same release is published — and the workspace install, CI included,
  # would fail in between.
  #
  # To make the site render against the workspace source again, replace its `@asheeui/*`
  # carets with `workspace:*` and delete the exclusion.
  - "!apps/docs"
allowBuilds:
  # A file watcher that arrives with the native styling toolchain. Nothing in this
  # workspace runs its build step, because the packages use it only through a
  # consumer's bundler, so its native binding is denied explicitly rather than left
  # unanswered (pnpm fails the install while a decision is missing).
  '@parcel/watcher': false
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@tanstack/react-start-rsc@0.1.53'
  - '@tanstack/react-start@1.168.54'
  - '@tanstack/start-plugin-core@1.171.44'
  # The native styling foundation: NativeWind and the CSS interop runtime it
  # depends on. Both are newer than the workspace's minimum release age, and both
  # are pinned to the versions the native package is verified against.
  - nativewind@4.2.7
  - react-native-css-interop@0.2.7
  - '@expo/cli@57.0.25'
  - '@expo/router-server@57.0.10'
  - babel-preset-expo@57.0.12
  - expo@57.0.23
  - '@asheeui/core@2.3.1'
  - '@asheeui/web@2.5.0'
# Transitive copies that arrive below a patched release are pinned to the patched
# version. `brace-expansion` reaches the tree through minimatch, one copy per major
# (1, 2 and 5); `fast-uri` arrives as a development dependency (ajv, through the
# @microsoft/api-extractor peer that auto-install-peers adds for vite-plugin-dts);
# and `happy-dom` is declared by @puckeditor/core without its published build
# importing it, so the override patches this workspace while a consumer of
# @asheeui/puck keeps whatever range that package declares. Every floor below is the
# version the advisory names as patched.
overrides:
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  fast-uri: ^3.1.9
  happy-dom: ^21.0.4
